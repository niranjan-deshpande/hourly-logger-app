appId: com.ndeshpande.hourlylogger
productName: Hourly Logger
copyright: Copyright © 2026 Niranjan Deshpande
asar: true
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - icon.icns
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  artifactName: HourlyLogger-${version}-arm64.dmg
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
